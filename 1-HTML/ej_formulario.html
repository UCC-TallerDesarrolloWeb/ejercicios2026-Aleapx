<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form action="procesar.php" method="post">
        <p>Nombre: <input type="text" name="nombre" placeholder="Ingrese su nombre"></p>
        <p>Apellido: <input type="text" name="apellido" placeholder="Ingrese su apellido"></p>
        <p>Sexo: <input type="radio" name="sexo" value="masculino"> Masculino
            <input type="radio" name="sexo" value="femenino"> Femenino
        </p>
        <p>Edad: <input type="number" name="edad" placeholder="Ingrese su edad"></p>
        <p>Email: <input type="email" name="email" placeholder="Ingrese su email"></p>
        <p>Usuario: <input type="text" name="usuario" placeholder="Ingrese su usuario"></p>
        <p>Password: <input type="password" name="password" placeholder="Ingrese su password"></p>
        <p>Confirmar Password: <input type="password" name="confirmar-password" placeholder="Repita su password"></p>
        <p>Tipo de servicio:
            <select name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>
        <p>Tema:
            <input type="checkbox" name="tema" value="politica"> Política
            <input type="checkbox" name="tema" value="negocios"> Negocios
            <input type="checkbox" name="tema" value="tecnologia"> Tecnología
            <input type="checkbox" name="tema" value="salud"> Salud
        </p>
        <p>Agregue un comentario: <textarea name="comentario" placeholder="Escriba un comentario"></textarea></p>
        <p><input type="submit" value="Enviar"></p>
    </form>


</body>

</html>
